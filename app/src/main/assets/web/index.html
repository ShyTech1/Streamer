<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Streamer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-torch" viewBox="0 0 24 24"><path fill="currentColor" d="M7 2h10l-1 6h-2v14l-4-8h2l1-4H8z"/></symbol>
        <symbol id="i-switch" viewBox="0 0 24 24"><path fill="currentColor" d="M15 3l4 4h-3v6h-2V7h-3zM9 21l-4-4h3v-6h2v6h3z"/></symbol>
        <symbol id="i-wide"   viewBox="0 0 24 24"><path fill="currentColor" d="M4 8h4V4H4zm12-4v4h4V4zM4 20h4v-4H4zm12 0h4v-4h-4zm-4-11a3 3 0 100 6 3 3 0 000-6z"/></symbol>
        <symbol id="i-focus"  viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm-8 4a1 1 0 011-1h2a1 1 0 010 2H5a1 1 0 01-1-1zm14 0a1 1 0 011-1h2a1 1 0 010 2h-2a1 1 0 01-1-1zM12 3a1 1 0 011 1v2a1 1 0 01-2 0V4a1 1 0 011-1zm0 15a1 1 0 011 1v2a1 1 0 01-2 0v-2a1 1 0 011-1z"/></symbol>
        <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></symbol>
        <symbol id="i-full"   viewBox="0 0 24 24"><path fill="currentColor" d="M5 5h5V3H3v7h2zm14 0v5h2V3h-7v2zM5 19v-5H3v7h7v-2zm14 0h-5v2h7v-7h-2z"/></symbol>
        <symbol id="i-gear"   viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.5 4a8.5 8.5 0 00-.1-1.3l2.1-1.6-2-3.5-2.5.9a8.4 8.4 0 00-2.3-1.3l-.4-2.6h-4l-.4 2.6a8.4 8.4 0 00-2.3 1.3l-2.5-.9-2 3.5 2.1 1.6a8.6 8.6 0 000 2.6L3.6 15.9l2 3.5 2.5-.9a8.4 8.4 0 002.3 1.3l.4 2.6h4l.4-2.6a8.4 8.4 0 002.3-1.3l2.5.9 2-3.5-2.1-1.6c.1-.4.1-.9.1-1.3z"/></symbol>
    </defs>
</svg>

<header>
    <div class="brand">
        <span class="dot" id="motionDot" title="motion indicator"></span>
        <span class="name">Streamer</span>
    </div>
    <span id="status" class="status">connecting…</span>
</header>

<main>
    <div class="video-wrap" id="videoWrap">
        <img id="video" src="/video.mjpeg" alt="live">
        <button class="fs-btn" id="fsBtn" title="fullscreen" aria-label="fullscreen">
            <svg><use href="#i-full"/></svg>
        </button>
        <span class="rec-badge" id="recBadge">REC</span>
    </div>

    <section class="card">
        <div class="btn-grid">
            <button class="iconbtn" data-act="torch">
                <svg><use href="#i-torch"/></svg><span>Torch</span>
            </button>
            <button class="iconbtn" data-act="switch">
                <svg><use href="#i-switch"/></svg><span id="switchLabel">Switch</span>
            </button>
            <button class="iconbtn" data-act="wide">
                <svg><use href="#i-wide"/></svg><span>Wide</span>
            </button>
            <button class="iconbtn" data-act="focus">
                <svg><use href="#i-focus"/></svg><span>Focus</span>
            </button>
            <button class="iconbtn record" data-act="record">
                <svg><use href="#i-record"/></svg><span>Record</span>
            </button>
        </div>
    </section>

    <section class="card">
        <div class="row">
            <label class="grow" for="zoom">Zoom
                <span class="mono" id="zoomVal">1.0×</span>
            </label>
        </div>
        <input type="range" id="zoom" min="0.5" max="10" step="0.1" value="1">
    </section>

    <section class="card">
        <label class="row" for="cameraPick">
            <span class="grow">Camera</span>
        </label>
        <select id="cameraPick"></select>
    </section>

    <section class="card">
        <button class="section-toggle" data-target="motionPanel">
            <svg><use href="#i-gear"/></svg><span>Motion detection</span>
            <span class="chev">▾</span>
        </button>
        <div class="collapsible" id="motionPanel">
            <div class="row">
                <span>Live magnitude</span>
                <span class="mono" id="motionMag">0.0</span>
            </div>
            <div class="meter"><div class="meter-fill" id="motionMeter"></div></div>

            <label class="slider-row">
                <span>Sensitivity <span class="hint">(lower = more sensitive)</span></span>
                <span class="mono" id="sensVal">12</span>
            </label>
            <input type="range" id="sens" min="2" max="40" step="1" value="12">

            <label class="slider-row">
                <span>Cooldown between events</span>
                <span class="mono" id="cooldownVal">5s</span>
            </label>
            <input type="range" id="cooldown" min="1" max="60" step="1" value="5">

            <label class="slider-row">
                <span>Motion-only stream window</span>
                <span class="mono" id="windowVal">10s</span>
            </label>
            <input type="range" id="window" min="2" max="120" step="1" value="10">

            <label class="check">
                <input type="checkbox" id="motionOnly">
                <span>Only stream when motion detected</span>
            </label>
            <label class="check">
                <input type="checkbox" id="motionRec">
                <span>Auto-record on motion</span>
            </label>
        </div>
    </section>

    <section class="card links">
        <a href="/photo.jpg" target="_blank">Snapshot</a>
        <a href="/motion/events" target="_blank">Motion events</a>
        <a href="/sensors" target="_blank">Sensors</a>
        <a href="/cameras" target="_blank">Cameras</a>
        <a href="/status" target="_blank">Status</a>
    </section>
</main>

<script src="/control.js"></script>
</body>
</html>
